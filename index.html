<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тапсырма тапсыру жүйесі</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto 25px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .task-box {
      background-color: #e9f5ff;
      border-left: 5px solid #2196F3;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }
    .task-box h3 {
      margin-top: 0;
      color: #0b7dda;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    textarea {
      height: 100px;
      resize: vertical;
    }
    button {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .btn-check {
      background-color: #2196F3;
    }
    .btn-check:hover {
      background-color: #0b7dda;
    }
    #status, #resultBox {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .loading { background-color: #e2e3e5; color: #383d41; }
  </style>
</head>
<body>

<!-- 1-БЛОК: ТАПСЫРМА ТУРАЛЫ АҚПАРАТ -->
<div class="container task-box">
  <h3>Тапсырманың берілгені:</h3>
  <p>Осы жерге оқушыларға арналған тапсырманың мәтінін жазасыз. Мысалы: "Дәптерге есепті шығарып, жауабын төмендегі формаға жазыңыз және дәптердің суретін тіркеңіз."</p>
</div>

<!-- 2-БЛОК: ТАПСЫРМА ЖІБЕРУ ФОРМАСЫ -->
<div class="container">
  <h2>Жауапты жіберу</h2>
  
  <form id="taskForm">
    <div class="form-group">
      <label for="studentName">Оқушының аты-жөні:</label>
      <input type="text" id="studentName" required placeholder="Мысалы: Сандуғаш">
    </div>
    <div class="form-group">
      <label for="studentGrade">Сыныбы / Тобы:</label>
      <input type="text" id="studentGrade" required placeholder="Мысалы: 1 курс">
    </div>
    <div class="form-group">
      <label for="studentAnswer">Тапсырма жауабы (мәтінмен):</label>
      <textarea id="studentAnswer" placeholder="Жауабыңызды осында жазыңыз..."></textarea>
    </div>
    <div class="form-group">
      <label for="fileInput">Сурет тіркеу (міндетті емес):</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <button type="button" id="submitBtn" onclick="submitTask()">Тапсырманы жіберу</button>
  </form>
  <div id="status"></div>
</div>

<!-- 3-БЛОК: НӘТИЖЕНІ ТЕКСЕРУ ОКНОСЫ -->
<div class="container">
  <h2>Бағаны тексеру</h2>
  <div class="form-group">
    <label for="searchId">Сіздің ID кодыңыз:</label>
    <input type="text" id="searchId" placeholder="Мысалы: ID-4821">
  </div>
  <button type="button" class="btn-check" id="checkBtn" onclick="checkResult()">Нәтижені көру</button>
  <div id="resultBox"></div>
</div>

<script>
  // 1. Google Script сілтемесі:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk3wApuy7SjwHNOfgsb0nZEarT1IuQgTJnfEOTWSjq9u-1Z-mOHTxn4xmd63sgJxtT/exec";
  
  // 2. Өзіңіздің ImgBB API кілтіңіз:
  const IMGBB_API_KEY = "a0bf89eaaeb5b90151f06529b8cd153e";

  async function submitTask() {
    const name = document.getElementById('studentName').value.trim();
    const grade = document.getElementById('studentGrade').value.trim();
    const answer = document.getElementById('studentAnswer').value.trim();
    const fileInput = document.getElementById('fileInput');
    const submitBtn = document.getElementById('submitBtn');

    if (!name || !grade) {
      alert("Аты-жөніңізді және сыныбыңызды толық жазыңыз!");
      return;
    }

    submitBtn.disabled = true;
    showStatus("Тапсырма жіберілуде, күте тұрыңыз...", "loading");

    let imageUrl = "Сурет жүктелмеді";

    // Суретті ImgBB-ге жүктеу
    if (fileInput.files.length > 0) {
      try {
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        const imgbbResponse = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
          method: "POST",
          body: formData
        });

        const imgbbResult = await imgbbResponse.json();
        
        if (imgbbResult.success) {
          imageUrl = imgbbResult.data.url;
        } else {
          alert("ҚАТЕ: Сурет жүктелмеді. ImgBB API кілтіңіз дұрыс емес болуы мүмкін!");
          console.error(imgbbResult);
        }
      } catch (err) {
        alert("Сурет жүктеу кезінде қате кетті. Интернетті тексеріңіз.");
        console.error("Сурет жүктеу қатесі:", err);
      }
    }

    // Google Таблицаға бағыттау
    const payload = {
      name: name,
      grade: grade,
      answer: answer,
      fileUrl: imageUrl
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.result === "success") {
        showStatus("Тапсырма сәтті жіберілді! Сіздің ID-іңіз: " + result.id, "success");
        document.getElementById('taskForm').reset();
      } else {
        showStatus("Қателік орын алды. Қайталап көріңіз.", "error");
      }
    } catch (error) {
      showStatus("Сервермен байланысу мүмкін болмады.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  }

  async function checkResult() {
    const searchId = document.getElementById('searchId').value.trim();
    const resultBox = document.getElementById('resultBox');
    const checkBtn = document.getElementById('checkBtn');

    if (!searchId) {
      alert("Өтініш, ID кодыңызды енгізіңіз!");
      return;
    }

    checkBtn.disabled = true;
    resultBox.style.display = "block";
    resultBox.className = "loading";
    resultBox.innerText = "Нәтиже ізделуде...";

    try {
      const response = await fetch(SCRIPT_URL + "?id=" + encodeURIComponent(searchId));
      const data = await response.json();

      if (data.found) {
        resultBox.className = "success";
        resultBox.innerHTML = `
          <strong>${data.name}</strong> үшін нәтиже:<br><br>
          <div style="text-align: left; font-weight: normal;">
            <p><strong>Балл:</strong> ${data.score ? data.score : "Әлі бағаланбады"}</p>
            <p><strong>Мұғалім комментарийі:</strong> ${data.comment ? data.comment : "Пікір жазылмаған"}</p>
          </div>
        `;
      } else {
        resultBox.className = "error";
        resultBox.innerText = "Мұндай ID табылмады. Кодты тексеріп қайта енгізіңіз.";
      }
    } catch (error) {
      resultBox.className = "error";
      resultBox.innerText = "Нәтижені алу мүмкін болмады.";
    } finally {
      checkBtn.disabled = false;
    }
  }

  function showStatus(message, className) {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = "block";
    statusDiv.className = className;
    statusDiv.innerText = message;
  }
</script>
</body>
</html>
